# Path to the mysqldump binary. Left as the plain command name by default so it
# resolves via PATH inside Docker (where the Dockerfile installs mysql-client
# system-wide). Override locally if running from an IDE, since GUI-launched
# processes on macOS often don't inherit Homebrew's PATH additions — e.g.
# DB_BACKUP_MYSQLDUMP_PATH=/opt/homebrew/opt/mysql-client/bin/mysqldump
app.backup.mysqldumpPath=${DB_BACKUP_MYSQLDUMP_PATH:mysqldump}
# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# Scheduler threads. The default is 1, which would let a long job (e.g. a database backup or an email send)
# delay every other scheduled job. Overridable per server with SCHEDULER_POOL_SIZE.
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:3}

# Mobile app: which students a parent login lists.
#   false (default) = family account only (students.family_account_id); sibling groups are ignored.
#   true            = sibling group first, family account as fallback (previous behavior).
app.mobile.siblingLookup.enabled=${MOBILE_SIBLING_LOOKUP_ENABLED:false}

# ── Login and API throttling (see "login-rate-limiting-plan") ────────────────────────────────────
# Mode: off     = nothing is counted
#       log     = counted, "SECURITY ... WOULD BLOCK" lines are written to the log, nobody is blocked
#       enforce = locked accounts / blocked addresses / over-limit API callers are refused (default)
# Review the log for a week or two in "log" mode before switching to "enforce". Switch back to "log" or "off"
# (no rebuild, just restart) if anything looks wrong. Counters are kept in memory; a restart clears them.
app.security.throttle.mode=${THROTTLE_MODE:enforce}
# Second switch: set false to keep only the per-account rules and turn off every per-IP rule.
app.security.throttle.ip-rules=${THROTTLE_IP_RULES:true}

