<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Exited Students</title>
</head>
<body>
<section>
<style>
  .ex-card { border-radius: 14px; border: 1px solid #e3e8ee; background: #fff; }
  .ex-card .card-header { background: #f8fafc; border-radius: 14px 14px 0 0; font-weight: 700; }
  .ex-table th { white-space: nowrap; font-size: .85rem; }
  .ex-table td { vertical-align: middle; }
  .ex-badge { color: #fff; font-weight: 600; }
  .tc-st-exited { background: #6c757d; }
  .tc-st-approved { background: #0d6efd; }
  .tc-st-tc_collected { background: #146c43; }
  .tc-st-reactivated, .tc-st-re_registered { background: #6f42c1; }
  .tc-st-cancelled { background: #dc3545; }
</style>

<div class="container-fluid px-3 px-lg-4">

  <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-people text-primary me-2"></i>Exited Students</h4>
      <p class="text-muted small mb-0">Students struck off from the school, and where each one stands.</p>
    </div>
    <a class="btn btn-danger btn-sm" th:href="@{/tc/strike-off}" sms:access="TC_STRIKE_OFF:VIEW">
      <i class="bi bi-box-arrow-right me-1"></i>Strike off a student
    </a>
  </div>
  <hr class="mt-1 mb-3"/>

  <div class="alert alert-success py-2" role="alert" th:if="${success}" th:text="${success}"></div>
  <div class="alert alert-danger py-2" role="alert" th:if="${error}" th:text="${error}"></div>

  <!-- ═══════════ Filters ═══════════ -->
  <div class="card ex-card mb-3">
    <div class="card-body">
      <form th:action="@{/tc/exits}" method="get" class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small mb-1" for="fQ">Student</label>
          <input type="text" class="form-control form-control-sm" id="fQ" name="q" th:value="${filter.q}"
                 placeholder="Name, father or mother">
        </div>
        <div class="col-md-2">
          <label class="form-label small mb-1" for="fStatus">Status</label>
          <select class="form-select form-select-sm" id="fStatus" name="status">
            <option value="">All</option>
            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                    th:selected="${filter.status == s}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small mb-1" for="fReason">Reason</label>
          <select class="form-select form-select-sm" id="fReason" name="reason">
            <option value="">All</option>
            <option th:each="r : ${reasons}" th:value="${r.name()}" th:text="${r.label}"
                    th:selected="${filter.reason == r}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small mb-1" for="fGrade">Class</label>
          <select class="form-select form-select-sm" id="fGrade" name="gradeId">
            <option value="">All</option>
            <option th:each="g : ${grades}" th:value="${g.id}" th:text="${g.gradeName}"
                    th:selected="${filter.gradeId != null and filter.gradeId == g.id}"></option>
          </select>
        </div>
        <div class="col-md-1">
          <label class="form-label small mb-1" for="fFrom">From</label>
          <input type="date" class="form-control form-control-sm" id="fFrom" name="fromDate" th:value="${filter.fromDate}">
        </div>
        <div class="col-md-1">
          <label class="form-label small mb-1" for="fTo">To</label>
          <input type="date" class="form-control form-control-sm" id="fTo" name="toDate" th:value="${filter.toDate}">
        </div>
        <div class="col-md-1 d-grid">
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i></button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════ List ═══════════ -->
  <div class="card ex-card mb-4">
    <div class="card-header py-2">
      <i class="bi bi-list-ul me-2"></i>Exits
      <span class="text-muted fw-normal small ms-2" th:text="'(' + ${rows.totalElements} + ')'"></span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm table-hover ex-table mb-0">
        <thead class="table-light">
        <tr>
          <th>Student</th>
          <th>Class</th>
          <th>SR no.</th>
          <th>Reason</th>
          <th>Last date</th>
          <th class="text-end">Dues</th>
          <th>Status</th>
          <th style="width:90px"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${rows.empty}">
          <td colspan="8" class="text-center text-muted py-4">No exits found.</td>
        </tr>
        <tr th:each="r : ${rows.content}">
          <td>
            <div class="fw-semibold" th:text="${r.studentName}"></div>
            <div class="small text-muted" th:if="${r.fatherName}" th:text="'Father: ' + ${r.fatherName}"></div>
          </td>
          <td th:text="${r.className + ' ' + r.sectionName + ' (' + r.mediumName + ')'}"></td>
          <td th:text="${r.srNo}"></td>
          <td th:text="${r.exitReason.label}"></td>
          <td th:text="${#temporals.format(r.exitDate, 'dd/MMM/yyyy')}"></td>
          <td class="text-end">
            <span th:text="'₹ ' + ${#numbers.formatDecimal(r.duesAmount, 1, 'COMMA', 2, 'POINT')}"></span>
            <div class="small text-muted" th:text="${r.duesFrozen} ? 'fixed' : 'estimate'"></div>
            <div class="small text-warning" th:if="${r.duesManual}">entered by hand</div>
          </td>
          <td>
            <span class="badge ex-badge" th:classappend="'tc-st-' + ${#strings.toLowerCase(r.status.name())}"
                  th:text="${r.status.label}"></span>
          </td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/tc/exits/{u}(u=${r.uuid})}">Open</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- paging -->
    <div class="card-footer d-flex justify-content-between align-items-center" th:if="${rows.totalPages > 1}">
      <span class="small text-muted" th:text="'Page ' + ${rows.number + 1} + ' of ' + ${rows.totalPages}"></span>
      <div class="btn-group btn-group-sm">
        <a class="btn btn-outline-secondary" th:classappend="${rows.first} ? 'disabled'"
           th:href="@{/tc/exits(page=${rows.number - 1},q=${filter.q},status=${filter.status},reason=${filter.reason},gradeId=${filter.gradeId},fromDate=${filter.fromDate},toDate=${filter.toDate})}">Previous</a>
        <a class="btn btn-outline-secondary" th:classappend="${rows.last} ? 'disabled'"
           th:href="@{/tc/exits(page=${rows.number + 1},q=${filter.q},status=${filter.status},reason=${filter.reason},gradeId=${filter.gradeId},fromDate=${filter.fromDate},toDate=${filter.toDate})}">Next</a>
      </div>
    </div>
  </div>
</div>
</section>
</body>
</html>
